<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0; url=./app/">
    <title>Codori</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f3f8fa;
        color: #174a75;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      }

      main {
        width: min(92vw, 520px);
        padding: 28px;
        border: 1px solid #d8e5ea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(47, 86, 109, 0.14);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0 0 18px;
        color: #526976;
        font-weight: 700;
        line-height: 1.7;
      }

      a {
        color: #0f65ad;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Codori</h1>
      <p>ウクレレコードを鳥キャラクター、運指、音、きもちで覚える学習アプリです。</p>
      <a href="./app/">Codoriアプリを開く</a>
    </main>
  </body>
</html>
