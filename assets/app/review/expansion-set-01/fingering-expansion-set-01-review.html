<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codori Expansion Set 01 Fingering Review</title>
    <style>
      :root {
        color: #16304f;
        background: #f6f8fb;
        font-family:
          "Hiragino Maru Gothic ProN",
          "Hiragino Maru Gothic Pro",
          "Arial Rounded MT Bold",
          "Hiragino Sans",
          system-ui,
          sans-serif;
      }

      body {
        margin: 0;
        padding: 28px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 22px;
        color: #596a78;
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(140px, 1fr));
        gap: 18px;
      }

      .item {
        display: grid;
        justify-items: center;
        gap: 8px;
        padding: 14px 12px 12px;
        border: 1px solid #dce6ee;
        border-radius: 14px;
        background: #fff;
      }

      img {
        width: 150px;
        height: 200px;
        object-fit: contain;
      }

      .name {
        font-weight: 800;
        color: #1e5aa8;
      }

      .meta {
        font-size: 12px;
        color: #687985;
      }

      @media (max-width: 720px) {
        body {
          padding: 22px;
        }

        .grid {
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <h1>Expansion Set 01 運指確認</h1>
    <p>Cメジャー周辺の6コード + 帰り道のG7。弦は上下方向、左から G / C / E / A。</p>
    <main class="grid" aria-label="Expansion Set 01 fingering review">
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_F_vertical_strings.svg" alt="F ukulele fingering">
        <div class="name">F</div>
        <div class="meta">Major / 2010</div>
      </section>
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_G_vertical_strings.svg" alt="G ukulele fingering">
        <div class="name">G</div>
        <div class="meta">Major / 0232</div>
      </section>
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_Am_vertical_strings.svg" alt="Am ukulele fingering">
        <div class="name">Am</div>
        <div class="meta">minor / 2000</div>
      </section>
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_Dm_vertical_strings.svg" alt="Dm ukulele fingering">
        <div class="name">Dm</div>
        <div class="meta">minor / 2210</div>
      </section>
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_Em_vertical_strings.svg" alt="Em ukulele fingering">
        <div class="name">Em</div>
        <div class="meta">minor / 0432</div>
      </section>
      <section class="item">
        <img src="../../fingering/expansion-set-01/ukulele_G7_vertical_strings.svg" alt="G7 ukulele fingering">
        <div class="name">G7</div>
        <div class="meta">7 / 0212</div>
      </section>
    </main>
  </body>
</html>
