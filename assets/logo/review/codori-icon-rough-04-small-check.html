<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Codori icon rough 04 small check</title>
    <style>
      body {
        margin: 0;
        padding: 24px;
        background: #fbfcfd;
        color: #1f2933;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }

      .checks {
        display: flex;
        align-items: flex-end;
        gap: 28px;
      }

      .item {
        display: grid;
        justify-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 700;
      }

      img {
        display: block;
        border: 1px solid #d9e3e8;
        border-radius: 8px;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="checks">
      <div class="item">
        <img src="../codori-icon-rough-04.svg" alt="128px icon check" width="128" height="128">
        <span>128px</span>
      </div>
      <div class="item">
        <img src="../codori-icon-rough-04.svg" alt="96px icon check" width="96" height="96">
        <span>96px</span>
      </div>
      <div class="item">
        <img src="../codori-icon-rough-04.svg" alt="64px icon check" width="64" height="64">
        <span>64px</span>
      </div>
      <div class="item">
        <img src="../codori-icon-rough-04.svg" alt="48px icon check" width="48" height="48">
        <span>48px</span>
      </div>
    </div>
  </body>
</html>
